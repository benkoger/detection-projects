[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wytrap"
version = "0.1.0"
description = "Wyoming camera-trap detection + classification pipeline (MegaDetector v6 -> BioCLIP-2)."
requires-python = ">=3.10"
license = { text = "Apache License (2.0)" }
dependencies = [
    "PytorchWildlife",
    "pybioclip",
    "torch",
    "Pillow",
    "numpy",
]

[project.scripts]
wytrap = "wytrap.cli:main"

[tool.setuptools.packages.find]
include = ["wytrap*"]
